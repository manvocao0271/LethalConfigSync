# Thunderstore CLI (tcli) package config.
# Paths are relative to this file. Built by:  dotnet build -c Release
# Requires icon.png (256x256 PNG) and LICENSE in this folder.

[config]
schemaVersion = "0.0.1"

[general]
repository = "https://thunderstore.io"

[package]
# "namespace" must be the exact name of the Thunderstore team/author you publish under.
namespace = "bobabulkerENTERPRISE"
name = "LethalConfigSync"
# The build passes --package-version from <Version> in the .csproj, which overrides this value.
versionNumber = "0.0.2"
description = "[BETA] Clients who join a host will have their LethalConfig settings rewritten (configurable)."
websiteUrl = ""
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2305"
AinaVT-LethalConfig = "1.4.6"

[build]
icon = "./icon.png"
# Packaged as README.md, which becomes the Thunderstore page.
readme = "./THUNDERSTORE.md"
outdir = "./bin/Thunderstore/netstandard2.1"

[[build.copy]]
source = "./bin/Release/netstandard2.1/bobabulkerENTERPRISE.LethalConfigSync.dll"
target = "plugins/"

[[build.copy]]
source = "./CHANGELOG.md"
target = "/"

[[build.copy]]
source = "./LICENSE"
target = "/"

[publish]
communities = [ "lethal-company" ]

[publish.categories]
lethal-company = [ "bepinex", "mods" ]
